name: Build

on:
  push:
    # main only. Every step branch permanently has a reference pull request, so a
    # push to one already produces a pull_request build; listing step-** here as
    # well would build each branch twice for the same commit.
    branches:
      - main
  pull_request:
    # The step branches are chained, so a step's pull request is based on the
    # previous step, not on main. Both bases have to be listed or only the first
    # step's pull request would ever get a build.
    branches:
      - main
      - 'step-**'
  schedule:
    # Monday 04:17 UTC. Catches drift across the whole chain even in weeks when
    # nobody pushes.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The branch that was actually pushed, or the head of the pull request.
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build ${{ github.head_ref || github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven build
        run: ./mvnw -B verify

  # The whole chain in one board. Proves every reference step still builds after
  # a restack, which a per-branch push build cannot show on its own.
  chain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build ${{ matrix.branch }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - step-01-prompt-injection
          - step-02-token-propagation
          - step-03-excessive-agency
          - step-04-sensitive-disclosure
          # step-05 pulls the Grafana LGTM dev service, but its tests set
          # %test.quarkus.observability.enabled=false, so it builds on CI like
          # any other branch.
          - step-05-observability
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven build
        run: ./mvnw -B verify
