version: 2

# Dependabot only reads this file from the default branch, so every bump lands on
# main. That is deliberate: adding a target-branch entry per step branch would
# open five parallel pull request streams per bump and bury the five reference
# pull requests. Carry a bump down the chain with scripts/restack.sh instead.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "maven"
    # One entry per module: each module pins its own versions, so the root
    # aggregator alone only gets one of them bumped.
    directories:
      - "/conference-mcp-server"
      - "/conference-assistant"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    # Bump a dependency in every module in a single pull request.
    groups:
      maven:
        group-by: "dependency-name"
